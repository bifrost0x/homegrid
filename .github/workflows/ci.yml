name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frontend and Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check generated service icon files
        run: node scripts/sync-service-icons.mjs --check
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck
      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test Go
        run: go test ./...
      - name: Vet Go
        run: go vet ./...

  docker:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate container build
        run: docker build --tag homegrid:ci .
      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -p homegrid-verify \
            -f docker-compose.yml -f docker-compose.dev.yml \
            -f tests/compose.verify.yaml config --quiet
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start disposable test container
        run: |
          docker run --detach --name homegrid-auth-check \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=16m,mode=1777 \
            --tmpfs /data:uid=65532,gid=65532,mode=0700 \
            -p 127.0.0.1:8096:8080 homegrid:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8096/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check browser sign-in
        run: node tests/auth.mjs
      - name: Check application management and category moves
        run: |
          # Restart clears the disposable /data tmpfs for a fresh setup fixture.
          docker restart homegrid-auth-check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8096/api/health; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          node tests/browser.mjs
          node tests/cross-category.mjs
      - name: Set up Go for TLS proxy fixture
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check HTTPS reverse proxy without trust configuration
        run: |
          docker restart homegrid-auth-check
          go build -o "$RUNNER_TEMP/homegrid-tls-proxy" ./tests/tls-proxy
          "$RUNNER_TEMP/homegrid-tls-proxy" &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            # Only this loopback fixture uses a generated self-signed certificate.
            if curl --insecure --fail --silent https://127.0.0.1:8443/api/health; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          node tests/reverse-proxy.mjs
      - name: Remove disposable test container
        if: always()
        run: docker rm --force --volumes homegrid-auth-check || true

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull Gitleaks
        # Gitleaks v8.30.1
        run: docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Scan history with redacted output
        run: >-
          docker run --rm --network none --read-only
          --env GIT_CONFIG_COUNT=1
          --env GIT_CONFIG_KEY_0=safe.directory
          --env GIT_CONFIG_VALUE_0=/repo
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact=100 --no-banner
